<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>待辦清單</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="todo-card" aria-labelledby="page-title">
      <header class="app-header">
        <div class="title-row">
          <div>
            <p class="eyebrow">今日整理</p>
            <h1 id="page-title">待辦清單</h1>
          </div>
          <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切換至深色模式">
            <span class="theme-icon" aria-hidden="true">🌙</span>
            <span class="theme-label">深色模式</span>
          </button>
        </div>
        <p class="subtitle">把想完成的事情，一件件放在眼前。</p>
      </header>

      <form class="todo-form" id="todo-form">
        <label class="sr-only" for="todo-input">輸入待辦事項</label>
        <input id="todo-input" name="todo" type="text" placeholder="接下來要完成什麼？" autocomplete="off" maxlength="100">
        <button type="submit" class="add-button">新增</button>
      </form>

      <div class="filter-bar" role="group" aria-label="待辦事項篩選">
        <button class="filter-button active" type="button" data-filter="all" aria-pressed="true">全部</button>
        <button class="filter-button" type="button" data-filter="active" aria-pressed="false">未完成</button>
        <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">已完成</button>
      </div>

      <p class="empty-state" id="empty-state">還沒有任何待辦事項,新增一個吧!</p>
      <ul class="todo-list" id="todo-list" aria-live="polite"></ul>

      <footer class="todo-footer">
        <span id="remaining-count">未完成:0 項</span>
        <button type="button" class="clear-button" id="clear-completed">清除已完成</button>
      </footer>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>待辦清單</title>
  <style>
    :root {
      --color-background: #f5f1ea;
      --color-surface: #fffdf9;
      --color-surface-muted: #f7f3ed;
      --color-text: #27302d;
      --color-text-muted: #7a827d;
      --color-accent: #d96c4f;
      --color-accent-dark: #b9523a;
      --color-border: #e9e1d7;
      --color-shadow: rgba(62, 48, 36, 0.1);
      --radius-card: 24px;
      --radius-control: 12px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--color-text);
      background:
        radial-gradient(circle at 15% 10%, rgba(236, 184, 146, 0.22), transparent 28%),
        radial-gradient(circle at 85% 90%, rgba(170, 201, 185, 0.22), transparent 30%),
        var(--color-background);
      font-family: Georgia, "Noto Serif TC", "Times New Roman", serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app-shell {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 32px 16px;
    }

    .todo-card {
      width: min(100%, 520px);
      padding: clamp(26px, 6vw, 44px);
      background: var(--color-surface);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: var(--radius-card);
      box-shadow: 0 20px 50px var(--color-shadow);
    }

    .app-header {
      margin-bottom: 28px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--color-accent);
      font-size: 0.78rem;
      font-weight: bold;
      letter-spacing: 0.16em;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 9vw, 3.2rem);
      line-height: 1.1;
    }

    .subtitle {
      margin: 12px 0 0;
      color: var(--color-text-muted);
      font-size: 0.98rem;
      line-height: 1.6;
    }

    .todo-form {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    .todo-form input {
      min-width: 0;
      flex: 1;
      padding: 13px 15px;
      color: var(--color-text);
      background: var(--color-surface-muted);
      border: 1px solid transparent;
      border-radius: var(--radius-control);
      outline: none;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    .todo-form input::placeholder {
      color: #a8aaa3;
    }

    .todo-form input:focus {
      border-color: var(--color-accent);
      box-shadow: 0 0 0 3px rgba(217, 108, 79, 0.14);
    }

    .add-button {
      padding: 0 19px;
      color: #fff;
      background: var(--color-accent);
      border: 0;
      border-radius: var(--radius-control);
      font-weight: bold;
      transition: background-color 160ms ease, transform 160ms ease;
    }

    .add-button:hover {
      background: var(--color-accent-dark);
    }

    .add-button:active {
      transform: translateY(1px);
    }

    .todo-list {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 10px 13px 14px;
      border-bottom: 1px solid var(--color-border);
      animation: appear 220ms ease both;
    }

    .todo-item:last-child {
      border-bottom: 0;
    }

    .todo-check {
      width: 19px;
      height: 19px;
      flex: 0 0 auto;
      margin: 0;
      accent-color: var(--color-accent);
    }

    .todo-text {
      min-width: 0;
      flex: 1;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    .todo-item.completed .todo-text {
      color: var(--color-text-muted);
      text-decoration: line-through;
      text-decoration-thickness: 1px;
    }

    .delete-button {
      padding: 7px;
      color: var(--color-text-muted);
      background: transparent;
      border: 0;
      font-size: 1.2rem;
      line-height: 1;
    }

    .delete-button:hover {
      color: var(--color-accent-dark);
    }

    .empty-state {
      margin: 26px 0;
      color: var(--color-text-muted);
      text-align: center;
      font-size: 0.94rem;
    }

    .empty-state[hidden] {
      display: none;
    }

    .todo-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 22px;
      padding-top: 18px;
      color: var(--color-text-muted);
      border-top: 1px solid var(--color-border);
      font-size: 0.88rem;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(-4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 420px) {
      .app-shell {
        padding: 16px 10px;
      }

      .todo-card {
        padding: 26px 20px;
        border-radius: 20px;
      }

      .todo-form {
        align-items: stretch;
        flex-direction: column;
      }

      .add-button {
        min-height: 45px;
      }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <section class="todo-card" aria-labelledby="page-title">
      <header class="app-header">
        <p class="eyebrow">今日整理</p>
        <h1 id="page-title">待辦清單</h1>
        <p class="subtitle">把想完成的事情，一件件放在眼前。</p>
      </header>

      <form class="todo-form" id="todo-form">
        <label class="sr-only" for="todo-input">輸入待辦事項</label>
        <input
          id="todo-input"
          name="todo"
          type="text"
          placeholder="接下來要完成什麼？"
          autocomplete="off"
          maxlength="100"
        >
        <button type="submit" class="add-button">新增</button>
      </form>

      <p class="empty-state" id="empty-state">還沒有任何待辦事項,新增一個吧!</p>
      <ul class="todo-list" id="todo-list" aria-live="polite"></ul>

      <footer class="todo-footer">
        <span id="remaining-count">未完成:0 項</span>
        <button type="button" class="clear-button" id="clear-completed">清除已完成</button>
      </footer>
    </section>
  </main>

  <script>
    const form = document.querySelector("#todo-form");
    const input = document.querySelector("#todo-input");
    const list = document.querySelector("#todo-list");
    const emptyState = document.querySelector("#empty-state");
    const remainingCount = document.querySelector("#remaining-count");

    // 待辦資料只存在目前頁面記憶體中，重新整理後會重新開始。
    let todos = [];

    function renderTodos() {
      list.replaceChildren();

      todos.forEach((todo) => {
        const item = document.createElement("li");
        item.className = "todo-item";
        item.dataset.id = todo.id;

        if (todo.completed) {
          item.classList.add("completed");
        }

        item.innerHTML = `
          <input class="todo-check" type="checkbox" ${todo.completed ? "checked" : ""} aria-label="完成 ${escapeHtml(todo.text)}">
          <span class="todo-text"></span>
          <button class="delete-button" type="button" aria-label="刪除 ${escapeHtml(todo.text)}">&times;</button>
        `;
        item.querySelector(".todo-text").textContent = todo.text;
        list.append(item);
      });

      const remaining = todos.filter((todo) => !todo.completed).length;
      remainingCount.textContent = `未完成:${remaining} 項`;
      emptyState.hidden = todos.length > 0;
    }

    function escapeHtml(text) {
      return text.replace(/[&<>'"]/g, (character) => {
        const entities = {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          "'": "&#39;",
          '"': "&quot;"
        };

        return entities[character];
      });
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const text = input.value.trim();

      if (!text) {
        input.focus();
        return;
      }

      todos.push({
        id: `${Date.now()}-${Math.random().toString(16).slice(2)}`,
        text,
        completed: false
      });

      renderTodos();
      form.reset();
      input.focus();
    });

    list.addEventListener("change", (event) => {
      if (!event.target.matches(".todo-check")) {
        return;
      }

      const item = event.target.closest(".todo-item");
      const todo = todos.find((entry) => entry.id === item.dataset.id);

      if (todo) {
        todo.completed = event.target.checked;
        renderTodos();
      }
    });

    list.addEventListener("click", (event) => {
      const deleteButton = event.target.closest(".delete-button");

      if (!deleteButton) {
        return;
      }

      const item = deleteButton.closest(".todo-item");
      todos = todos.filter((todo) => todo.id !== item.dataset.id);
      renderTodos();
    });

    renderTodos();
  </script>
</body>
</html>
